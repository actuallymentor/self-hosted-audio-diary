name: Release images

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: anthropic/claude-sonnet-4.6
      OPENROUTER_ZDR_ONLY: "true"
      RUN_OPENROUTER_TESTS: "true"
      RUN_TTS_TESTS: "true"
      TRANSCRIPTION_MODEL_CACHE_PATH: ${{ github.workspace }}/.test-runtime/models
      TTS_MODEL: google/gemini-3.1-flash-tts-preview
      TTS_PROVIDER: openrouter
      TTS_RESPONSE_FORMAT: pcm
      TTS_VOICE: Sulafat
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out published tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate release version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore pinned speech-model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .test-runtime/models
          key: large-v3-edaa852ec7e145841d8ffdb056a99866-${{ runner.os }}-${{ runner.arch }}

      - run: npm ci
      - name: Verify two clean isolated runs
        run: |
          ./scripts/verify
          ./scripts/verify

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      transcriber_digest: ${{ steps.transcriber.outputs.digest }}
    steps:
      - name: Check out published tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate registry configuration
        env:
          APP_IMAGE: ${{ vars.DOCKERHUB_APP_IMAGE }}
          TRANSCRIBER_IMAGE: ${{ vars.DOCKERHUB_TRANSCRIBER_IMAGE }}
        run: test -n "$APP_IMAGE" && test -n "$TRANSCRIBER_IMAGE"

      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install emulators
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Publish application manifest
        id: app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          build-args: APP_VERSION=${{ needs.verify.outputs.version }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_APP_IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ vars.DOCKERHUB_APP_IMAGE }}:latest

      - name: Publish transcriber manifest
        id: transcriber
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          build-args: APP_VERSION=${{ needs.verify.outputs.version }}
          context: transcriber
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_TRANSCRIBER_IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ vars.DOCKERHUB_TRANSCRIBER_IMAGE }}:latest

  validate-published:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    env:
      APP_DIGEST: ${{ needs.publish.outputs.app_digest }}
      APP_IMAGE: ${{ vars.DOCKERHUB_APP_IMAGE }}
      TRANSCRIBER_DIGEST: ${{ needs.publish.outputs.transcriber_digest }}
      TRANSCRIBER_IMAGE: ${{ vars.DOCKERHUB_TRANSCRIBER_IMAGE }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out published source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore pinned speech-model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .test-runtime/models
          key: large-v3-edaa852ec7e145841d8ffdb056a99866-${{ runner.os }}-${{ runner.arch }}

      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Verify published manifests
        run: |
          verify_manifest() {
            image=$1
            digest=$2
            manifest=$(docker buildx imagetools inspect --raw "$image@$digest")

            jq -e '
              any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
              any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
            ' <<<"$manifest" >/dev/null

            test "$(docker buildx imagetools inspect --raw "$image:$VERSION")" = "$manifest"
            test "$(docker buildx imagetools inspect --raw "$image:latest")" = "$manifest"
          }

          verify_manifest "$APP_IMAGE" "$APP_DIGEST"
          verify_manifest "$TRANSCRIBER_IMAGE" "$TRANSCRIBER_DIGEST"

      - name: Pull published native images
        run: |
          verify_label() {
            image=$1
            version=$(
              docker image inspect "$image" \
                --format '{{index .Config.Labels "org.opencontainers.image.version"}}'
            )

            test "$version" = "$VERSION"
          }

          docker pull "$APP_IMAGE:$VERSION"
          docker pull "$TRANSCRIBER_IMAGE:$VERSION"

          verify_label "$APP_IMAGE:$VERSION"
          verify_label "$TRANSCRIBER_IMAGE:$VERSION"

          docker run --rm --entrypoint node "$APP_IMAGE:$VERSION" \
            -e "Promise.all([import('argon2'), import('better-sqlite3')])"
          docker run --rm --entrypoint python "$TRANSCRIBER_IMAGE:$VERSION" \
            -c "import av, ctranslate2, faster_whisper"

      - name: Boot published services
        run: |
          set -Eeuo pipefail

          docker network create shad-published-network >/dev/null
          docker volume create shad-published-app >/dev/null
          docker volume create shad-published-diary >/dev/null

          docker run --detach --name shad-published-transcriber \
            --env APP_GID=$(id -g) \
            --env APP_UID=$(id -u) \
            --env TRANSCRIPTION_OFFLINE=true \
            --network shad-published-network \
            --network-alias transcriber \
            --publish 127.0.0.1:8000:8000 \
            --volume "$GITHUB_WORKSPACE/.test-runtime/models:/var/lib/transcriber/huggingface" \
            "$TRANSCRIBER_IMAGE:$VERSION"

          docker run --detach --name shad-published-app \
            --env TRANSCRIPTION_URL=http://transcriber:8000 \
            --network shad-published-network \
            --publish 127.0.0.1:3000:3000 \
            --volume shad-published-app:/data/app \
            --volume shad-published-diary:/data/diary \
            "$APP_IMAGE:$VERSION"

          for attempt in $(seq 1 360); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready | jq -e '.status == "ok"' >/dev/null && \
              curl --fail --silent http://127.0.0.1:8000/readyz | jq -e '.status == "ready"' >/dev/null; then
              break
            fi

            sleep 10
          done

          curl --fail --silent http://127.0.0.1:8000/readyz | jq -e '.status == "ready"' >/dev/null
          docker run --rm --network shad-published-network --entrypoint node \
            "$APP_IMAGE:$VERSION" -e \
            "fetch('http://transcriber:8000/readyz').then(response => { if (!response.ok) process.exit(1) })"
          curl --fail --silent \
            --form file=@tests/fixtures/audio/fake-microphone.wav \
            --form language=mixed \
            --form model=large-v3 \
            --form response_format=verbose_json \
            http://127.0.0.1:8000/v1/audio/transcriptions >/dev/null

      - name: Clean published-image smoke test
        if: always()
        run: |
          docker rm --force shad-published-app shad-published-transcriber 2>/dev/null || true
          docker volume rm shad-published-app shad-published-diary 2>/dev/null || true
          docker network rm shad-published-network 2>/dev/null || true
