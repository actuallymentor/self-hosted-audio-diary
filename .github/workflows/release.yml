name: Release images

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: anthropic/claude-sonnet-4.6
      OPENROUTER_ZDR_ONLY: "true"
      RUN_OPENROUTER_TESTS: "true"
      RUN_TTS_TESTS: "true"
      TRANSCRIPTION_MODEL_CACHE_PATH: ${{ github.workspace }}/.test-runtime/models
      TTS_MODEL: google/gemini-3.1-flash-tts-preview
      TTS_PROVIDER: openrouter
      TTS_RESPONSE_FORMAT: pcm
      TTS_VOICE: Sulafat
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out published tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate release version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore pinned speech-model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .test-runtime/models
          key: large-v3-edaa852ec7e145841d8ffdb056a99866-${{ runner.os }}-${{ runner.arch }}

      - run: npm ci
      - name: Verify two clean isolated runs
        run: |
          ./scripts/verify
          ./scripts/verify

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out published tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate registry configuration
        env:
          APP_IMAGE: ${{ vars.DOCKERHUB_APP_IMAGE }}
          TRANSCRIBER_IMAGE: ${{ vars.DOCKERHUB_TRANSCRIBER_IMAGE }}
        run: test -n "$APP_IMAGE" && test -n "$TRANSCRIBER_IMAGE"

      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install emulators
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Publish application manifest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          build-args: APP_VERSION=${{ needs.verify.outputs.version }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_APP_IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ vars.DOCKERHUB_APP_IMAGE }}:latest

      - name: Publish transcriber manifest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          build-args: APP_VERSION=${{ needs.verify.outputs.version }}
          context: transcriber
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_TRANSCRIBER_IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ vars.DOCKERHUB_TRANSCRIBER_IMAGE }}:latest
